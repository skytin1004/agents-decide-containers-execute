name: Documentation check to Issue
run-name: Documentation check (${{ inputs.checks }})
on:
  workflow_dispatch:
    inputs:
      checks:
        description: Approved documentation checks
        type: choice
        options: [both, links, translation]
        default: both
      request_id:
        description: Leave empty for a new request; reuse the same ID to recover a publication
        type: string
        default: ""
      mode:
        description: Start a Routine or publish an already committed result
        type: choice
        options: [run, publish-existing]
        default: run
permissions:
  contents: read
concurrency:
  group: docops-issue-publisher
  cancel-in-progress: false
jobs:
  demo:
    if: github.repository == 'skytin1004/agents-decide-containers-execute' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      INPUT_CHECKS: ${{ inputs.checks }}
      INPUT_REQUEST_ID: ${{ inputs.request_id }}
      INPUT_MODE: ${{ inputs.mode }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install . -r requirements-publisher.txt
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_ISSUE_DEMO_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Invoke Routine and verify the committed report
        run: python scripts/issue_demo.py collect
      - name: Publish or reuse the Issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/issue_demo.py publish
      - name: Preserve execution and publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docops-issue-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/issue-demo/
          retention-days: 30
          if-no-files-found: ignore
